<section id="abcde" class="tab mt-6">
    <form id="abcdeSettings" data-save="save_abcde_settings" class="glass rounded-2xl p-6">
        {{ form.hidden_tag() }}
        <label for="abcdeConfigText" class="label">abcde.conf (how music CDs are ripped)</label>
        <textarea id="abcdeConfigText" name="abcdeConfig" spellcheck="false" rows="30" class="field mt-2 font-mono text-xs"
                  {% if abcde_read_only %}disabled title="abcde.conf is read-only"{% endif %}>{{ abcde_cfg }}</textarea>
        <button type="submit" class="btn mt-3" {{ 'disabled' if abcde_read_only }}>Save abcde.conf</button>
    </form>
</section>
