{% from 'settings/fields.html' import fields %}
<section id="apprise" class="tab mt-6">
    <div class="glass rounded-2xl p-6">
        <p class="text-sm text-muted">ARM sends its notifications through Apprise to the services set here (apprise.yaml).</p>
        <a href="testapprise" class="btn mt-3 inline-block">Send a test notification</a>
    </div>
    <form id="appriseCfg" data-save="save_apprise_cfg" class="glass mt-5 rounded-2xl px-6 py-3">
        {{ form.hidden_tag() }}
        {{ fields(apprise_cfg.items(), none, apprise_read_only, "apprise.yaml") }}
        <button type="submit" class="btn my-3" {{ 'disabled' if apprise_read_only }}>Save apprise.yaml</button>
    </form>
</section>
