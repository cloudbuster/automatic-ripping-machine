{% from 'settings/fields.html' import fields %}
<section id="ripper" class="tab mt-6">
    <form id="ripperSettings" data-save="save_settings" class="glass rounded-2xl px-6 py-3">
        {{ form.hidden_tag() }}
        {{ fields(settings.items(), jsoncomments, ripper_read_only, "arm.yaml") }}
        <button type="submit" class="btn my-3" {{ 'disabled' if ripper_read_only }}>Save arm.yaml</button>
    </form>
</section>
