{% extends "glass_base.html" %}
{% block title %}Sharing disc IDs{% endblock %}
{% block content %}
    <p id="progress" class="mt-2 px-1 text-sm text-muted" role="status" data-jobs="{{ job_list | tojson | forceescape }}">Starting&hellip;</p>
    <ol id="sent" class="glass mt-5 rounded-2xl"></ol>
{% endblock %}
{% block scripts %}
<script>
    (async function () {  // one json?mode=send_item request per disc, in turn
        const progress = document.getElementById("progress");
        const list = document.getElementById("sent");
        const jobs = JSON.parse(progress.dataset.jobs);
        let done = 0;
        for (const id of jobs) {
            let job = {job_id: id, error: "no answer"};
            try { job = await (await fetch(`json?mode=send_item&job=${encodeURIComponent(id)}`)).json(); } catch (e) { /* kept */ }
            const li = document.createElement("li");
            li.className = `px-5 py-3 text-sm ${list.children.length ? "divider" : ""}`;
            li.textContent = `${job.title || "Job " + id}: ${job.error ? "not sent, " + job.error : "sent"}`;
            if (job.error) li.classList.add("text-bad");
            list.append(li);
            progress.textContent = `${++done} of ${jobs.length} sent`;
        }
        if (!jobs.length) progress.textContent = "No identified DVDs to send.";
    }());
</script>
{% endblock %}
