<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ arm_name }}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <script>try { const t = localStorage.getItem('arm-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<!-- Home page: everything below main is filled in by static/js/home.js from json?mode=home (arm/ui/home_api.py) -->
<body class="font-sans" data-refresh="{{ refresh }}" data-auth="{{ 1 if authenticated else 0 }}">
<button id="theme-toggle" type="button" aria-label="Switch light or dark"
        class="glass lift fixed z-20 grid h-11 w-11 place-items-center rounded-full"
        style="top: calc(1.25rem + env(safe-area-inset-top, 0px)); right: calc(1.25rem + env(safe-area-inset-right, 0px));">
    <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="var(--accent)" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg id="icon-sun" hidden width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#fcd34d"/><g stroke="#fcd34d" stroke-width="2" stroke-linecap="round"><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></g></svg>
</button>

<main class="mx-auto max-w-4xl py-14 sm:py-16">
    <header class="mb-10 text-center">
        <span id="badge" class="glass inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-xs font-semibold uppercase tracking-wider text-accent">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2.5"/></svg>
            <span id="badge-text">{{ arm_name }}</span>
        </span>
        <h1 class="mt-5 text-4xl font-extrabold tracking-tight sm:text-5xl">ARM<span class="text-accent">.</span></h1>
        <p class="mt-3 text-muted">Put a disc in. When the tray opens, put in the next one.</p>
    </header>

    <section id="now" class="grid grid-cols-1 gap-5 md:grid-cols-5" aria-label="Now">
        <article class="glass rounded-2xl p-6 md:col-span-5 text-muted">Loading&hellip;</article>
    </section>
    <div id="notes" class="mt-5 flex flex-col gap-3" aria-label="Notices"></div>

    <section id="queue-section" class="mt-10" aria-labelledby="queue-title" hidden>
        <div class="mb-3 flex items-baseline justify-between px-1">
            <h2 id="queue-title" class="text-xl font-bold">Queue</h2>
            <span id="queue-count" class="text-sm text-muted"></span>
        </div>
        <ol id="queue" class="flex flex-col gap-3"></ol>
    </section>

    <section id="finished-section" class="mt-10" aria-labelledby="finished-title" hidden>
        <div class="mb-3 flex items-baseline justify-between px-1">
            <h2 id="finished-title" class="text-xl font-bold">Finished</h2>
            <a href="history" class="text-sm font-medium text-accent">All jobs &rarr;</a>
        </div>
        <div id="finished" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
    </section>

    <footer class="mt-12 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-sm text-muted">
        {% if authenticated %}
            <a href="settings" class="hover:text-ink">Settings</a>
            <a href="logs" class="hover:text-ink">Logs</a>
            <a href="database" class="hover:text-ink">Database</a>
            <a href="notificationview" class="hover:text-ink">Notifications</a>
        {% else %}
            <a href="login" class="hover:text-ink">Log in</a>
        {% endif %}
        <span id="free"></span>
        <span id="version"></span>
    </footer>
    <p id="error" class="mt-4 text-center text-sm text-bad" role="status" hidden></p>
</main>
<script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
